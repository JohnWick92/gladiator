apiVersion: v1
kind: Service
metadata:
  creationTimestamp: "2024-09-26T23:22:19Z"
  labels:
    app: gladiator
  name: gladiator
spec:
  ports:
    - name: "5432"
      nodePort: 30100
      port: 5432
      targetPort: 5432
    - name: "9000"
      nodePort: 32708
      port: 9000
      targetPort: 9000
  selector:
    app: gladiator
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: "2024-09-26T23:22:19Z"
  labels:
    app: gladiator
  name: gladiator-deployment
spec:
  selector:
    matchLabels:
      app: gladiator
  template:
    metadata:
      annotations:
        io.kubernetes.cri-o.SandboxID/gladiator: 76b0d7b2084f78c705f0781ea5b208c1d57e53a82e79c51a670968a9e60b04a3
        io.kubernetes.cri-o.SandboxID/postgres: 76b0d7b2084f78c705f0781ea5b208c1d57e53a82e79c51a670968a9e60b04a3
      creationTimestamp: "2024-09-26T23:22:19Z"
      labels:
        app: gladiator
      name: gladiator
    spec:
      containers:
        - args:
            - postgres
          env:
            - name: POSTGRES_PASSWORD
              value: podman
          image: docker.io/library/postgres:15
          name: postgres
          ports:
            - containerPort: 5432
            - containerPort: 9000
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: gladiator-vol-pvc
        - args:
            - php
            - artisan
            - serve
            - --host=0.0.0.0
            - --port=9000
          image: quay.io/johnwick92/gladiator:v1.0.3
          name: gladiator
      volumes:
        - name: gladiator-vol-pvc
          persistentVolumeClaim:
            claimName: gladiator-claim
